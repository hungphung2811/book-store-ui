server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # File băm tên: cache lâu. index.html không cache để nhận bản mới ngay
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  # SPA: mọi đường dẫn khác trả index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
