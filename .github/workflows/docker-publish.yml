# Build và đẩy image storefront lên GHCR: ghcr.io/<chủ repo>/book-store-ui. Tag: sha ngắn, latest (main), tên tag git (v1.2.3).
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Giá trị nhúng vào bundle lúc build (không phải bí mật). VITE_API_BASE phải có https://
  VITE_SHOP_CODE: demo
  VITE_API_BASE: https://java.tahoanghiep.com

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/book-store-ui
          tags: |
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_SHOP_CODE=${{ env.VITE_SHOP_CODE }}
            VITE_API_BASE=${{ env.VITE_API_BASE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
